services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: microbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: microbase
      POSTGRES_PASSWORD: microbase
      POSTGRES_DB: microbase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: microbase-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
