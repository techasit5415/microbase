name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.10.58). Leave empty to use latest git tag.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-binaries:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            if [ -z "$TAG" ]; then
              TAG=$(git describe --tags --abbrev=0)
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "$TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Admin UI
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build all PocketBase-style zip archives & checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          VER="${VERSION#v}"
          OUT="dist/${VERSION}"
          mkdir -p "${OUT}"
          LDFLAGS="-s -w -X github.com/techasit5415/microbase/internal/config.Version=${VERSION}"

          TARGETS=(
            "darwin amd64 amd64"
            "darwin arm64 arm64"
            "linux amd64 amd64"
            "linux arm64 arm64"
            "linux arm armv7"
            "linux ppc64le ppc64le"
            "linux s390x s390x"
            "windows amd64 amd64"
            "windows arm64 arm64"
          )

          for target in "${TARGETS[@]}"; do
            set -- $target
            GOOS=$1
            GOARCH=$2
            LABEL=$3
            GOARM=""
            [ "$LABEL" = "armv7" ] && GOARM="7"

            BIN="microbase"
            [ "$GOOS" = "windows" ] && BIN="microbase.exe"

            STAGE="${OUT}/stage_${GOOS}_${LABEL}"
            mkdir -p "${STAGE}"
            echo "Building ${GOOS}/${LABEL}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM \
              go build -ldflags="${LDFLAGS}" -o "${STAGE}/${BIN}" ./cmd/server
            [ -f README.md ] && cp README.md "${STAGE}/"
            [ -f .env.example ] && cp .env.example "${STAGE}/"

            (cd "${STAGE}" && zip -q -r "../microbase_${VER}_${GOOS}_${LABEL}.zip" .)
            rm -rf "${STAGE}"
          done

          (cd "${OUT}" && sha256sum *.zip > checksums.txt)
          ls -lh "${OUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }} Release
          generate_release_notes: true
          files: dist/${{ steps.ver.outputs.version }}/*

  docker-package:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            if [ -z "$TAG" ]; then
              TAG=$(git describe --tags --abbrev=0)
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "$TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-sdk-package:
    name: Publish TypeScript SDK to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@techasit5415'

      - name: Sync SDK version with git tag & publish
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            [ -z "$TAG" ] && TAG=$(git describe --tags --abbrev=0)
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "$TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          TAG_VER="${TAG#v}"
          if echo "$TAG_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            npm version "$TAG_VER" --no-git-tag-version --allow-same-version
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "@techasit5415/microbase-sdk@${PKG_VER}" version >/dev/null 2>&1; then
            echo "@techasit5415/microbase-sdk@${PKG_VER} is already published, skipping."
          else
            npm publish
          fi
